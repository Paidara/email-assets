<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paidara</title>
<meta name="description" content="Paidara. Paid in full. Paid on time. Coming soon.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --navy:#193067; --white:#FFFFFF; --hivis:#E8E861; --mist:#C9CED6; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--navy); color:var(--white);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  img { width:min(320px, 72vw); height:auto; display:block; margin:0 auto 32px; }
  h1 { font-size:clamp(26px, 5vw, 40px); font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; }
  p { margin:0; font-size:17px; color:var(--mist); }
  a { color:var(--hivis); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  .soon { margin-bottom:28px; }
</style>
</head>
<body>
  <img src="logo.svg" alt="Paidara">
  <h1>Paid in full. Paid on time.</h1>
  <p class="soon">Coming soon.</p>
  <p><a href="mailto:hello@paidara.com">hello@paidara.com</a></p>
</body>
</html>
